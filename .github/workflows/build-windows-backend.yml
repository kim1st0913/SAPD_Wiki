name: Build Windows Backend

on:
  # This isolated delivery branch keeps the Windows build workflow out of main.
  push:
    branches:
      - codex/windows-electron
    paths:
      - ".github/workflows/build-windows-backend.yml"
      - "scripts/package_backend_pyinstaller.py"
      - "scripts/package_backend_windows.ps1"
      - "scripts/run_local_server.py"
      - "src/sapd_wiki/**"
  # GitHub exposes the manual button only after this workflow reaches main.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-backend:
    name: Package SAPD Wiki backend (Windows x64)
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packaging dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller "openpyxl>=3.1.0" "cryptography==49.0.0" "mcp[cli]==1.28.1" "rfc8785==0.1.4" "uvicorn==0.51.0"

      - name: Verify bundled MCP runtime
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}\src
        run: |
          python -m unittest tests.mcp_integration.test_bundle_mcp_runtime tests.mcp_sidecar.test_dev_supervisor

      - name: Package native Windows backend
        shell: pwsh
        run: |
          .\scripts\package_backend_windows.ps1 -OutputDir dist\windows-backend

      - name: Verify and prepare download artifact
        shell: pwsh
        run: |
          $backendRoot = Join-Path $env:GITHUB_WORKSPACE "dist\windows-backend\backend\win-x64"
          $backendExe = Join-Path $backendRoot "SAPD-Wiki-Backend.exe"
          $artifactRoot = Join-Path $env:GITHUB_WORKSPACE "dist\windows-backend\artifact\SAPD-Wiki-Backend-win-x64"

          if (-not (Test-Path -LiteralPath $backendExe -PathType Leaf)) {
            throw "Expected backend executable was not produced: $backendExe"
          }

          & $backendExe --help
          if ($LASTEXITCODE -ne 0) {
            throw "Backend --help smoke check failed with exit code $LASTEXITCODE"
          }

          & $backendExe --mcp-sidecar --help
          if ($LASTEXITCODE -ne 0) {
            throw "Bundled MCP sidecar smoke check failed with exit code $LASTEXITCODE"
          }

          New-Item -ItemType Directory -Force -Path $artifactRoot | Out-Null
          Copy-Item -Path (Join-Path $backendRoot "*") -Destination $artifactRoot -Recurse -Force

          $backendHash = (Get-FileHash -LiteralPath $backendExe -Algorithm SHA256).Hash.ToLowerInvariant()
          $fileCount = (Get-ChildItem -LiteralPath $artifactRoot -File -Recurse).Count
          $buildInfo = [ordered]@{
            schemaVersion = "sapd-windows-backend-artifact-v1"
            sourceRevision = $env:GITHUB_SHA
            platform = "win-x64"
            executable = "SAPD-Wiki-Backend.exe"
            executableSha256 = $backendHash
            fileCount = $fileCount
            builtAtUtc = (Get-Date).ToUniversalTime().ToString("o")
          }
          $buildInfo | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $artifactRoot "build-info.json") -Encoding utf8
          "$backendHash *SAPD-Wiki-Backend.exe" | Set-Content -LiteralPath (Join-Path $artifactRoot "SHA256SUMS.txt") -Encoding ascii

      - name: Upload Windows backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAPD-Wiki-Backend-win-x64-${{ github.sha }}
          path: dist/windows-backend/artifact/
          if-no-files-found: error
          retention-days: 14
