version: v1
outputs:
  json:
    enabled: true
    file_name: maturity-result.json
  markdown:
    enabled: true
    file_name: maturity-report.md
  html:
    enabled: true
    file_name: maturity-report.html
  excel:
    enabled: false
  pptx:
    enabled: false
sections:
  - id: summary
    title: 评估摘要
  - id: scope
    title: 客户与评估范围
  - id: method
    title: 评估方法与三维模型说明
  - id: overall
    title: 整体成熟度结论
  - id: radar
    title: 能力分类 / L1 雷达图数据
  - id: heatmap
    title: L2 安全能力成熟度热力图数据
  - id: focus_details
    title: 能力关注点明细
  - id: top_gaps
    title: 主要短板与优先级
  - id: evidence_coverage
    title: 证据覆盖情况
  - id: review_items
    title: 未匹配与低置信度内容
  - id: recommendations
    title: 改进建议与路线图
  - id: appendix
    title: 附录：规则、模板、知识库快照和来源追踪
chart_data:
  file_name: charts-data.json
  include:
    - overall
    - radar
    - heatmap
    - top_gaps
    - evidence_coverage
    - match_confidence_distribution
