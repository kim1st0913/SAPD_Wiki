<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SAPD Wiki 关系工作台</title>
    <link rel="stylesheet" href="./styles.css?v=route-refresh-contract-20260602-1" />
  </head>
  <body>
    <div id="app" class="app-shell">
      <aside class="app-sidebar" aria-label="SAPD Wiki 主导航">
        <div class="brand">
          <div class="brand-mark">S</div>
          <div>
            <h1>SAPD Wiki</h1>
            <p>本地业务关系工作台</p>
          </div>
        </div>

        <nav class="module-tabs" aria-label="业务关系模块">
          <div class="nav-group-label">关系视图</div>
          <button id="overviewTab" class="module-tab active" type="button" data-view="overview">
            <span class="nav-symbol">⌁</span><span>关系总览</span><small>Overview</small>
          </button>
          <button id="capabilityTab" class="module-tab" type="button" data-view="capabilities">
            <span class="nav-symbol">▣</span><span>安全能力映射</span><small>Capability</small>
          </button>
          <button id="environmentTab" class="module-tab" type="button" data-view="environment">
            <span class="nav-symbol">◫</span><span>信息化环境维度</span><small>Environment</small>
          </button>
          <button id="devLifecycleTab" class="module-tab" type="button" data-view="dev-lifecycle">
            <span class="nav-symbol">◇</span><span>LC-AP安全开发生命周期</span><small>LC-AP</small>
          </button>
          <button id="dataLifecycleTab" class="module-tab" type="button" data-view="data-lifecycle">
            <span class="nav-symbol">◎</span><span>LC-DT数据生命周期安全</span><small>LC-DT</small>
          </button>

          <div class="nav-group-label">知识维护</div>
          <button id="maintenanceTab" class="module-tab" type="button" data-view="maintenance">
            <span class="nav-symbol">☷</span><span>专项知识维护</span><small>Tables</small>
          </button>
          <button id="contentTab" class="module-tab" type="button" data-view="content">
            <span class="nav-symbol">□</span><span>说明与视图</span><small>Views</small>
          </button>
        </nav>

        <div class="sidebar-status">
          <span>运行模式</span>
          <strong>本地静态页面</strong>
          <small>读取导出的 JSON 数据，不依赖在线服务</small>
        </div>
      </aside>

      <div class="app-main">
        <header class="topbar">
          <div class="page-context">
            <span>Relationship Workspace</span>
            <strong>树、矩阵、技术/管理并列映射</strong>
          </div>
          <div class="search-wrap">
            <span class="search-icon" aria-hidden="true">⌕</span>
            <input id="searchInput" type="search" placeholder="搜索能力、对象、作用域、服务、流程或模块" />
          </div>
          <div id="localModeStatus" class="topbar-status" aria-label="本地运行状态"></div>
          <div class="metrics" id="metrics"></div>
        </header>

        <section class="workspace-stage">

      <main id="overviewWorkspace" class="overview-workspace">
        <section class="overview-map-pane">
          <div class="pane-head">
            <h2>业务关系地图</h2>
            <span class="type-pill">关系优先</span>
          </div>
          <div id="overviewMap" class="overview-map"></div>
        </section>
        <section class="overview-coverage-pane">
          <div class="pane-head">
            <h2>关系覆盖统计</h2>
            <span id="overviewGeneratedAt" class="type-pill">待加载</span>
          </div>
          <div id="overviewCoverage" class="overview-coverage"></div>
        </section>
        <aside class="overview-issue-pane">
          <div class="pane-head">
            <h2>待确认数据</h2>
            <span class="count-pill">契约</span>
          </div>
          <div id="overviewIssues" class="overview-issues"></div>
        </aside>
      </main>

      <main id="capabilityWorkspace" class="capability-workspace is-hidden">
        <aside class="capability-tree-pane">
          <div class="pane-head">
            <h2>安全能力树</h2>
          </div>
          <div id="tree" class="tree"></div>
        </aside>

        <section class="capability-relation-pane">
          <div class="capability-workbench-head">
            <div>
              <p class="eyebrow">Capability Relationship Workspace</p>
              <h2>当前关注点工作台</h2>
            </div>
            <div class="capability-workbench-tools">
              <input id="capabilitySearchInput" type="search" placeholder="搜索能力、服务、作用域、流程、模块" />
              <span class="filter-chip">关注点</span>
              <span class="filter-chip">服务</span>
              <span class="filter-chip">流程</span>
              <span class="filter-chip">模块</span>
            </div>
          </div>
          <div id="detail" class="capability-relation-workspace"></div>
        </section>
      </main>

      <main id="environmentWorkspace" class="environment-workspace is-hidden">
        <section class="environment-detail-pane">
          <div id="environmentDetail" class="environment-detail"></div>
        </section>
      </main>

      <main id="devLifecycleWorkspace" class="lifecycle-workspace is-hidden">
        <section class="lifecycle-main-pane">
          <div class="pane-head lifecycle-stage-bar">
            <h2 id="devLifecyclePageTitle"></h2>
            <div id="devLifecycleNav" class="lifecycle-nav lifecycle-stage-tabs"></div>
            <label class="lifecycle-stage-search" for="devLifecycleStageSearch">
              <span aria-hidden="true">⌕</span>
              <input id="devLifecycleStageSearch" type="search" placeholder="搜索阶段、编码或活动..." autocomplete="off" />
            </label>
          </div>
          <div id="devLifecycleLane" class="lifecycle-lane"></div>
        </section>
        <aside class="lifecycle-detail-pane">
          <div class="pane-head">
            <h2>阶段关系详情</h2>
            <span id="devLifecycleType" class="type-pill">占位</span>
          </div>
          <div id="devLifecycleDetail" class="lifecycle-detail"></div>
        </aside>
      </main>

      <main id="dataLifecycleWorkspace" class="lifecycle-workspace is-hidden">
        <section class="lifecycle-main-pane">
          <div class="pane-head lifecycle-stage-bar">
            <h2 id="dataLifecyclePageTitle"></h2>
            <div id="dataLifecycleNav" class="lifecycle-nav lifecycle-stage-tabs"></div>
            <label class="lifecycle-stage-search" for="dataLifecycleStageSearch">
              <span aria-hidden="true">⌕</span>
              <input id="dataLifecycleStageSearch" type="search" placeholder="搜索过程、编码或场景..." autocomplete="off" />
            </label>
          </div>
          <div id="dataLifecycleMatrix" class="lifecycle-lane"></div>
        </section>
        <aside class="lifecycle-detail-pane">
          <div class="pane-head">
            <h2>过程关系详情</h2>
            <span id="dataLifecycleType" class="type-pill">占位</span>
          </div>
          <div id="dataLifecycleDetail" class="lifecycle-detail"></div>
        </aside>
      </main>

      <main id="maintenanceWorkspace" class="source-workspace is-hidden">
        <aside id="sourceNavPane" class="source-nav-pane">
          <div class="pane-head">
            <h2>专项知识维护</h2>
          </div>
          <div id="maintenanceNavigation" class="source-nav" aria-label="专项知识维护二级页面">
            <button id="scopesPageTab" class="source-nav-button active" type="button" data-source-page="scopes">
              <span>作用域清单</span>
              <strong id="scopeCount">0</strong>
            </button>
            <button id="processesPageTab" class="source-nav-button" type="button" data-source-page="processes">
              <span>流程清单</span>
              <strong id="processCount">0</strong>
            </button>
            <button id="workFunctionsPageTab" class="source-nav-button" type="button" data-source-page="work-functions">
              <span>职能清单</span>
              <strong id="workFunctionCount">0</strong>
            </button>
            <button id="servicesPageTab" class="source-nav-button" type="button" data-source-page="services">
              <span>安全技术服务清单</span>
              <strong id="serviceCatalogCount">0</strong>
            </button>
            <button id="modulesPageTab" class="source-nav-button" type="button" data-source-page="modules">
              <span>安全技术模块清单</span>
              <strong id="moduleCount">0</strong>
            </button>
            <button id="measuresPageTab" class="source-nav-button" type="button" data-source-page="measures">
              <span>安全技术措施清单</span>
              <strong id="measureCount">0</strong>
            </button>
            <button id="referencesPageTab" class="source-nav-button" type="button" data-source-page="references">
              <span>岗位参考页面</span>
              <strong id="referenceCount">0</strong>
            </button>
          </div>
        </aside>

        <section id="sourceCatalogPane" class="source-catalog-pane">
          <div id="sourceList" class="source-list-pane"></div>
        </section>

        <section id="sourceDetailPane" class="source-detail-pane">
          <div class="pane-head">
            <h2>实体关系详情</h2>
            <span id="sourceDetailType" class="type-pill">未选择</span>
          </div>
          <div id="sourceDetail" class="source-detail-content"></div>
        </section>
      </main>

      <main id="contentWorkspace" class="content-workspace is-hidden">
        <aside class="content-nav-pane">
          <div class="pane-head">
            <h2 id="contentNavTitle">页面预览</h2>
          </div>
          <div id="contentNavList" class="source-nav" aria-label="页面预览">
            <button id="htmlDocsTab" class="source-nav-button active" type="button" data-content-page="html">
              <span>HTML 知识说明</span>
              <strong id="htmlDocCount">0</strong>
            </button>
            <button id="drawioViewsTab" class="source-nav-button" type="button" data-content-page="drawio">
              <span>Draw.io 只读图</span>
              <strong id="drawioViewCount">0</strong>
            </button>
            <button id="pptGuideTab" class="source-nav-button" type="button" data-content-page="ppt">
              <span>PPT 使用说明</span>
              <strong id="pptGuideCount">0</strong>
            </button>
          </div>
        </aside>
        <section class="content-list-pane">
          <div class="pane-head">
            <h2 id="contentPageTitle">HTML 知识说明</h2>
            <span id="contentPageCount" class="count-pill">0</span>
          </div>
          <div id="contentList" class="content-list"></div>
        </section>
        <section class="content-detail-pane">
          <div class="pane-head">
            <h2>内容详情</h2>
            <span id="contentDetailType" class="type-pill">未选择</span>
          </div>
          <div id="contentDetail" class="content-detail"></div>
        </section>
      </main>
      <main id="placeholderWorkspace" class="placeholder-workspace is-hidden">
        <section id="placeholderDetail" class="placeholder-page-panel"></section>
      </main>
        </section>
      </div>
    </div>
    <script src="./dataClient.js?v=light-planning-pdf-20260530"></script>
    <script src="./displayLabels.js?v=relation-chip-cell-containment-20260530"></script>
    <script src="./viewModels.js?v=lazy-load-contract-20260602-1"></script>
    <script src="./components/AppShell.js?v=modeling-language-guide-tabs-20260602-1"></script>
    <script src="./components/StatusBadge.js"></script>
    <script src="./components/DimensionTree.js?v=capability-tree-l0-20260520-1"></script>
    <script src="./components/FocusOverview.js"></script>
    <script src="./components/FocusScopeServiceMatrix.js?v=baseline-closeout-20260530"></script>
    <script src="./components/FocusManagementMapping.js?v=baseline-closeout-20260530"></script>
    <script src="./components/EnvironmentTree.js"></script>
    <script src="./components/EnvironmentRelationshipOverview.js"></script>
    <script src="./components/EnvironmentScopeServiceMatrix.js?v=service-chip-semantic-20260530-1"></script>
    <script src="./components/EnvironmentDetailPanel.js"></script>
    <script src="./components/ApplicationSecurityLifecycle.js?v=lifecycle-head-clean-20260603-1"></script>
    <script src="./components/MaintenanceNavigation.js"></script>
    <script src="./components/MaintenanceShell.js?v=knowledge-dictionary-label-20260601-1"></script>
    <script src="./components/CapabilityDirectoryMaintenanceTable.js?v=knowledge-collapsed-default-20260601-1"></script>
    <script src="./components/ScopeMaintenanceTable.js?v=scope-relation-bubbles-20260601-1"></script>
    <script src="./components/ProcessMaintenanceTable.js?v=process-function-bubble-20260601-1"></script>
    <script src="./components/WorkFunctionMaintenanceTable.js?v=work-function-mapping-columns-20260601-1"></script>
    <script src="./components/TechnicalServiceMaintenanceTable.js?v=technical-service-no-definition-20260602-1"></script>
    <script src="./components/TechnologyModuleMaintenanceTable.js?v=module-no-measure-mapping-20260601-1"></script>
    <script src="./components/TechnicalMeasureMaintenanceTable.js?v=technical-measure-display-20260601-1"></script>
    <script src="./components/ApplicationSystemDirectoryTable.js?v=application-system-directory-20260525-1"></script>
    <script src="./components/LcapReferenceMaintenanceTable.js"></script>
    <script src="./components/StandardRoleReferenceTable.js?v=reference-reverse-mapping-20260601-1"></script>
    <script src="./components/StandardFrameworkTable.js?v=lazy-load-contract-20260602-1"></script>
    <script src="./components/MaintenanceDetailPanel.js"></script>
    <script src="./components/TechnicalMeasureMaintenance.js"></script>
    <script src="./components/DetailInspector.js"></script>
    <script src="./generated/archimateNotationRegistry.generated.js?v=archimate-registry-derived-20260603-1"></script>
    <script src="./app.js?v=archimate-icon-label-baseline-20260603-1"></script>
  </body>
</html>
