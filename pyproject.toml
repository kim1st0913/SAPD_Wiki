[project]
name = "sapd-wiki"
version = "0.1.0"
description = "Local structured knowledge base import MVP for SAPD Wiki."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1.0",
]

[project.optional-dependencies]
local-mcp = [
  "cryptography==49.0.0",
  "mcp==1.28.1",
  "rfc8785==0.1.4",
  "uvicorn==0.51.0",
]

[project.scripts]
sapd-wiki = "sapd_wiki.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
